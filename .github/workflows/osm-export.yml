# Ежедневная выгрузка магазинов, аптек, торговых центров и ориентиров Эстонии из OpenStreetMap
# для карты магазинов madalhind.ee (копия workflow maza-kaina-osm / aeronavtik/mazacena-osm с эстонскими данными). Результат публикуется на GitHub Pages:
#   https://<пользователь>.github.io/<репозиторий>/meta.json, food.json, other.json, places.json

name: OSM export

on:
  schedule:
    # 00:00 UTC = 02:00 зимой / 03:00 летом по Таллину: выгрузка (~3 минуты) готова до импорта на сайте в 03:15;
    # Geofabrik обновляет выгрузку Эстонии днём (около 09:20 UTC), ночью берётся вчерашняя
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: osm-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy1.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install osmium
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool

      - name: Download Estonia extract (Geofabrik)
        run: |
          # «latest» у Geofabrik иногда ведёт на ещё не выложенный файл (23.11.2026: lithuania-261122 → 404),
          # тогда берём последний доступный файл с датой из списка папки
          base=https://download.geofabrik.de/europe/estonia
          # get адрес повторы: причина неудачи видна в аннотациях запуска
          get() {
            local code=0
            curl -sSfL --retry "$2" --retry-delay 60 --retry-all-errors --connect-timeout 30 --max-time 240 --speed-limit 100000 --speed-time 60 -o estonia.osm.pbf "$1" || code=$?
            if [ "$code" -ne 0 ]; then echo "::warning::$1: curl $code"; fi
            return "$code"
          }
          if get "$base-latest.osm.pbf" 4; then exit 0; fi
          files=$(curl -sSfL --retry 3 --retry-delay 30 --retry-all-errors --connect-timeout 30 --max-time 60 "$base/" | grep -oE 'estonia-[0-9]{6}\.osm\.pbf' | sort -ru | sed -n '1,2p') || true
          if [ -z "$files" ]; then echo "::warning::список файлов $base/ не загрузился"; fi
          for f in $files; do
            echo "::warning::estonia-latest недоступен, пробую $f"
            if get "$base/$f" 1; then exit 0; fi
          done
          exit 1

      - name: Cut Estonia by its official border
        run: |
          # Выгрузка Geofabrik захватывает полосу соседних стран: режем по границе Эстонии из самих данных
          osmium tags-filter estonia.osm.pbf r/ISO3166-1=EE -o border.osm.pbf --overwrite
          osmium export border.osm.pbf --geometry-types=polygon -f geojson -o border.geojson --overwrite
          php build.php border border.geojson border-ee.geojson
          osmium extract -p border-ee.geojson estonia.osm.pbf -o ee.osm.pbf --overwrite

      - name: Filter shops, pharmacies, malls, landmarks and bottle return machines
        run: |
          osmium tags-filter ee.osm.pbf \
            nwr/shop=supermarket,convenience,wholesale,general,department_store,mall,alcohol,doityourself,hardware,furniture,variety_store,chemist,cosmetics,perfumery,houseware,garden_centre,interior_decoration,household_linen,bed,electronics,sports,trade,building_materials,paint,bathroom_furnishing,kitchen,clothes,shoes \
            nwr/amenity=pharmacy,bus_station,townhall,marketplace,hospital,post_office,place_of_worship,vending_machine,recycling \
            nwr/railway=station,halt \
            nwr/tourism=museum \
            nwr/vending=bottle_return \
            -o filtered.osm.pbf --overwrite
          osmium export filtered.osm.pbf -f geojsonseq --add-unique-id=type_id --geometry-types=point,linestring,polygon -x print_record_separator=false -o filtered.geojsonseq --overwrite

      - name: Build JSON files
        run: |
          export OSM_TIMESTAMP="$(osmium fileinfo -g header.option.osmosis_replication_timestamp estonia.osm.pbf || true)"
          mkdir -p out
          php build.php features filtered.geojsonseq out
          touch out/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

      # Сразу после загрузки GitHub не всегда видит артефакт («No artifacts named github-pages», 24.11.2026 — у Латвии и Эстонии),
      # а сама публикация иногда падает («Deployment failed, try again later», 24.11.2026 — у Литвы): пауза и до трёх попыток
      - name: Wait for the artifact
        run: sleep 20
      - id: deploy1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Pause before the second attempt
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Pause before the third attempt
        if: steps.deploy2.outcome == 'failure'
        run: sleep 180
      - id: deploy3
        if: steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Keep the schedule alive
        run: |
          # GitHub отключает расписание, если в репозитории 60 дней нет коммитов: раз в 50 дней — пустой служебный коммит
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt 4320000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: schedule stays active"
            git push
          fi
